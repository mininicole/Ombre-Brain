  --lamp: #EEEBE3; --lamp-soft: rgba(238, 235, 227, 0.10); --glow: rgba(238, 235, 227, 0.20);
  --note: #ECEAE3; --note-2: #E6E4DC; --note-ink: #2B2D33; --tape: rgba(255, 255, 255, .28); --bubble: #222B40; --on-lamp: #1A1606;
  --overlay: linear-gradient(to bottom, rgba(10, 15, 30, .92), rgba(14, 21, 40, .80) 55%, rgba(17, 23, 38, .70));
  --glass: rgba(26, 34, 52, .68);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html { background: var(--bg); }
body {
  position: relative; margin: 0; background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.65;
  padding-inline: 18px; padding-block: calc(14px + env(safe-area-inset-top, 0px)) calc(48px + env(safe-area-inset-bottom, 0px));
  font-variant-numeric: tabular-nums; -webkit-text-size-adjust: 100%;
}
.scene { position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background: var(--overlay), var(--bg-img) var(--bg-pos) / cover no-repeat, var(--bg); }
.page { position: relative; z-index: 1; max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 30px; }
button { font: inherit; color: inherit; background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
button:focus-visible, textarea:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline: 2px solid var(--lamp); outline-offset: 2px; }
.sr { position: absolute; left: -9999px; }
[hidden] { display: none !important; }
img { max-width: 100%; }

/* login */
.gate { position: fixed; inset: 0; z-index: 20; display: grid; place-items: center; padding: 24px; }
.gate-box { width: min(320px, 100%); display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center; }
.gate-box .mark { font-family: var(--font-display); font-weight: 600; font-size: 22px; letter-spacing: .08em; }
.gate-box .mark sup { font-size: 12px; }
.gate-box p { margin: 0; color: var(--muted); font-size: 13px; }
.gate-box input { width: 100%; height: 46px; border-radius: 999px; border: 1px solid var(--line); background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); color: var(--ink); font: inherit; text-align: center; letter-spacing: .2em; }
.gate-box button { width: 100%; height: 46px; border-radius: 999px; background: var(--lamp); color: var(--on-lamp); font-weight: 500; letter-spacing: .3em; }
.gate-error { min-height: 1.2em; font-size: 12px; color: #B4544A; }

/* top */
.topbar { position: relative; display: flex; align-items: center; justify-content: space-between; }
.hello { font-size: 13px; color: var(--muted); }
.hello b { color: var(--ink); font-weight: 500; }
.gear { width: 36px; height: 36px; border-radius: 50%; display: grid; place-items: center; color: var(--muted); }
.gear svg { width: 20px; height: 20px; }
.gear-menu { position: absolute; right: 0; top: 42px; z-index: 6; width: 268px; background: var(--paper-2); border: 1px solid var(--line); border-radius: 16px; padding: 14px; display: flex; flex-direction: column; gap: 10px; box-shadow: 0 14px 34px rgba(0,0,0,.16); }
.gm-label { font-size: 12px; color: var(--muted); }
.seg { display: grid; grid-template-columns: repeat(3, 1fr); background: var(--bg); border-radius: 10px; padding: 3px; gap: 3px; }
.seg button { padding: 7px 0; border-radius: 8px; font-size: 13px; color: var(--muted); }
.seg button[aria-checked="true"] { background: var(--paper); color: var(--ink); font-weight: 500; box-shadow: 0 1px 3px rgba(0,0,0,.1); }
.gm-hint { font-size: 11px; color: var(--muted); margin-top: -4px; }
.gm-sep { padding-top: 10px; border-top: 1px dashed var(--line); }
.bg-row { display: flex; align-items: center; gap: 8px; }
.bg-thumb { width: 40px; height: 52px; border-radius: 8px; flex: none; background: var(--overlay), var(--bg-img) var(--bg-pos) / cover no-repeat, var(--bg); box-shadow: inset 0 0 0 1px var(--line); }
.av-thumb { width: 44px; height: 44px; border-radius: 50%; background: var(--avatar) center / cover no-repeat, #5E6B63; }
.bg-btn { padding: 7px 12px; border-radius: 999px; background: var(--lamp); color: var(--on-lamp); font-size: 13px; cursor: pointer; }
.bg-btn.ghost { background: transparent; color: var(--ink); border: 1px solid var(--line); }
.gm-links { display: flex; flex-direction: column; border-top: 1px dashed var(--line); padding-top: 4px; }
.gm-item { display: flex; justify-content: space-between; padding: 9px 2px; font-size: 14px; text-align: left; }
.gm-item + .gm-item { border-top: 1px dashed var(--line); }

/* him */
.him { display: flex; flex-direction: column; align-items: center; gap: 14px; padding-top: 10px; text-align: center; }
.who { display: flex; flex-direction: column; align-items: center; gap: 10px; }
.avatar { position: relative; width: 76px; height: 76px; }
.avatar::before { content: ""; position: absolute; inset: -14px; border-radius: 50%; background: radial-gradient(circle, var(--glow) 0%, transparent 70%); animation: breathe 4.5s ease-in-out infinite; }
.avatar .face { position: relative; width: 100%; height: 100%; border-radius: 50%; background: var(--avatar) center / cover no-repeat, #5E6B63; box-shadow: 0 0 0 3px var(--paper); }
@keyframes breathe { 0%, 100% { transform: scale(.92); opacity: .75; } 50% { transform: scale(1.08); opacity: 1; } }
@media (prefers-reduced-motion: reduce) { .avatar::before { animation: none; } }
.name { display: flex; flex-direction: column; align-items: center; gap: 2px; font-size: 17px; font-weight: 600; line-height: 1.3; }
.status { font-size: 13px; font-weight: 400; color: var(--muted); }
.status .dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: var(--lamp); margin-right: 6px; vertical-align: 1px; }
.sig { margin: 6px 0 0; max-width: 320px; font-family: var(--font-display); font-weight: 600; font-size: 24px; line-height: 1.55; text-wrap: balance; overflow-wrap: anywhere; }
.sig.empty { font-size: 16px; font-weight: 500; color: var(--muted); }
.weather { font-size: 12px; color: var(--muted); display: flex; gap: 8px; justify-content: center; flex-wrap: wrap; min-height: 1.6em; }
.weather span + span::before { content: "·"; margin-right: 8px; }

.said { align-self: stretch; margin-top: 10px; text-align: left; display: flex; flex-direction: column; gap: 10px;
  background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 22px; padding: 14px 16px 16px; }
.said .when { font-size: 12px; color: var(--muted); }
.bubble { max-width: 92%; background: var(--bubble); padding: 11px 15px; border-radius: 18px 18px 18px 6px; box-shadow: 0 1px 0 var(--line), 0 4px 12px rgba(40, 50, 35, .06); white-space: pre-line; overflow-wrap: anywhere; }
.voice { display: flex; align-items: center; gap: 10px; margin-top: 6px; white-space: normal; }
.voice .play { width: 28px; height: 28px; border-radius: 50%; background: var(--lamp); color: var(--on-lamp); display: grid; place-items: center; flex: none; }
.voice .play svg { width: 11px; height: 11px; }
.wave { display: inline-flex; gap: 3px; align-items: center; height: 18px; }
.wave i { width: 3px; border-radius: 2px; background: var(--lamp); opacity: .8; transform-origin: center; }
.voice.playing .wave i { animation: wave .9s ease-in-out infinite; }
.voice.playing .wave i:nth-child(2n) { animation-delay: -.3s; }
.voice.playing .wave i:nth-child(3n) { animation-delay: -.6s; }
@keyframes wave { 0%, 100% { transform: scaleY(.5); } 50% { transform: scaleY(1.1); } }
@media (prefers-reduced-motion: reduce) { .voice.playing .wave i { animation: none; } }
.voice small { color: var(--muted); font-size: 12px; }
.quiet { font-size: 14px; color: var(--muted); }
.poke { align-self: flex-end; display: inline-flex; align-items: center; gap: 6px; padding: 7px 14px; border-radius: 999px; background: var(--lamp); color: var(--on-lamp); font-size: 13px; font-weight: 500; box-shadow: 0 4px 12px var(--glow); }
.poke svg { width: 15px; height: 15px; }
.poke:active { transform: scale(.97); }
.poke:disabled { opacity: .7; }

/* doors */
.doors { display: flex; flex-direction: column; gap: 14px; }
.chat-door { display: flex; align-items: center; gap: 14px; padding: 16px 18px; border-radius: 22px; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); text-align: left; }
.chat-door .ic { width: 44px; height: 44px; border-radius: 50%; background: var(--lamp-soft); color: var(--lamp); display: grid; place-items: center; flex: none; }
.chat-door .ic svg { width: 22px; height: 22px; }
.chat-door .txt { min-width: 0; display: flex; flex-direction: column; }
.chat-door strong { font-size: 16px; font-weight: 600; }
.chat-door .txt span { font-size: 13px; color: var(--muted); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.chat-door .arrow { margin-left: auto; color: var(--muted); font-size: 20px; }
.small-doors { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.door { display: flex; flex-direction: column; align-items: center; gap: 7px; font-size: 13px; color: var(--ink); }
.door .ring { width: 54px; height: 54px; border-radius: 50%; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); display: grid; place-items: center; }
.door svg { width: 22px; height: 22px; }

/* section heads */
.head { display: flex; align-items: baseline; justify-content: space-between; margin-bottom: 12px; }
.head h2 { font-family: var(--font-display); font-weight: 600; font-size: 19px; margin: 0; }
.head small { font-size: 12px; color: var(--muted); }

/* us */
.days { display: flex; align-items: baseline; gap: 8px; margin-bottom: 14px; }
.days .n { font-family: var(--font-display); font-size: 52px; font-weight: 700; line-height: 1; color: var(--lamp); }
.days .t { font-size: 14px; }
.days .since { margin-left: auto; font-size: 12px; color: var(--muted); }
.journal { display: flex; flex-direction: column; background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border-radius: 20px; padding: 16px 18px 12px; border: 1px solid var(--line); }
.journal-head { display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); margin-bottom: 4px; }
.journal ul { list-style: none; margin: 0; padding: 0; }
.journal li { display: grid; grid-template-columns: 44px 1fr; gap: 10px; padding: 9px 0; border-bottom: 1px dashed var(--line); }
.journal li:last-child { border-bottom: 0; }
.journal .mt { font-size: 12px; color: var(--lamp); padding-top: 2px; }
.journal li div { min-width: 0; display: flex; flex-direction: column; }
.journal b { font-weight: 500; font-size: 14px; overflow-wrap: anywhere; }
.journal li span:not(.mt) { font-size: 13px; color: var(--muted); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.journal li.empty { display: block; padding: 10px 0; font-size: 14px; color: var(--muted); }
.more { align-self: flex-start; color: var(--muted); font-size: 13px; padding: 6px 0 0; }
.more:hover { color: var(--ink); }

.polaroids { display: flex; justify-content: center; gap: 18px; margin-top: 22px; padding-inline: 4px; }
.polaroid { margin: 0; width: 46%; max-width: 180px; background: #FCFBF7; padding: 8px 8px 10px; border-radius: 4px; box-shadow: 0 8px 20px rgba(30, 30, 20, .14); display: block; }
.polaroid:nth-child(1) { transform: rotate(-3deg); }
.polaroid:nth-child(2) { transform: rotate(2.5deg); margin-top: 12px; }
.polaroid img { display: block; width: 100%; aspect-ratio: 1; object-fit: cover; border-radius: 2px; background: #E5E3DC; }
.polaroid figcaption { margin-top: 6px; font-family: var(--font-display); font-size: 12px; color: #4D4A40; text-align: center; }

/* he says */
.write { background: var(--glass); -webkit-backdrop-filter: blur(12px); backdrop-filter: blur(12px); border: 1px solid var(--line); border-radius: 20px; padding: 14px; display: flex; flex-direction: column; gap: 10px; }
.write textarea { width: 100%; min-height: 60px; resize: vertical; border: 0; background: transparent; color: var(--ink); font: inherit; font-size: 14px; padding: 2px 4px; }
.write textarea::placeholder { color: var(--muted); }
.write-row { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; justify-content: flex-end; border-top: 1px dashed var(--line); padding-top: 10px; }
.mini { height: 32px; border: 1px solid var(--line); border-radius: 999px; background: var(--bg); color: var(--ink); font: inherit; font-size: 12px; padding: 0 10px; }
.save { padding: 7px 18px; border-radius: 999px; background: var(--ink); color: var(--paper); font-size: 14px; }
.notes { display: grid; grid-template-columns: 1fr 1fr; gap: 14px 12px; margin-top: 18px; }
.note { position: relative; background: var(--note); color: var(--note-ink); padding: 16px 14px 12px; border-radius: 3px 3px 14px 3px; box-shadow: 0 1px 1px rgba(0, 0, 0, .04), 0 8px 18px rgba(30, 35, 25, .10); font-size: 14px; line-height: 1.6; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
.note::before { content: ""; position: absolute; top: -7px; left: 50%; width: 46px; height: 14px; transform: translateX(-50%) rotate(-2deg); background: var(--tape); border-radius: 1px; }
.note:nth-child(3n+1) { transform: rotate(-1.6deg); }
.note:nth-child(3n+2) { transform: rotate(1.4deg); background: var(--note-2); }
.note:nth-child(3n) { transform: rotate(-.6deg); grid-column: 1 / -1; }
.note .meta { margin-top: 8px; font-size: 11px; opacity: .65; white-space: normal; }
.notes .none { grid-column: 1 / -1; }
.notes + .more { margin-top: 12px; }

/* all quotes sheet */
.sheet { position: fixed; inset: 0; background: var(--bg); overflow-y: auto; z-index: 8; padding-inline: 18px; padding-block: calc(12px + env(safe-area-inset-top, 0px)) 40px; }
.sheet-inner { max-width: 440px; margin: 0 auto; display: flex; flex-direction: column; gap: 14px; }
.sheet-head { display: flex; align-items: center; gap: 10px; position: sticky; top: 0; background: var(--bg); padding-block: 6px; z-index: 1; }
.sheet-head h2 { font-family: var(--font-display); font-weight: 600; font-size: 20px; margin: 0; }
.back { width: 36px; height: 36px; border-radius: 50%; background: var(--paper); border: 1px solid var(--line); font-size: 22px; line-height: 1; }
.shuffle { margin-left: auto; padding: 7px 14px; border-radius: 999px; background: var(--lamp-soft); font-size: 13px; }
.search { height: 42px; border: 1px solid var(--line); border-radius: 999px; background: var(--paper); color: var(--ink); font: inherit; font-size: 14px; padding: 0 16px; }
.all-list { display: flex; flex-direction: column; gap: 10px; }
.month { font-family: var(--font-display); font-size: 14px; color: var(--muted); margin: 12px 2px 0; }
.qcard { background: var(--note); color: var(--note-ink); border-radius: 3px 3px 12px 3px; padding: 12px 14px; display: grid; grid-template-columns: 1fr auto; gap: 4px 10px; box-shadow: 0 4px 10px rgba(40,35,20,.08); }
.qcard.flash { box-shadow: 0 0 0 2px var(--lamp); }
.qcard q { font-size: 14px; line-height: 1.6; quotes: "“" "”"; min-width: 0; overflow-wrap: anywhere; white-space: pre-line; }
.qcard .meta { grid-column: 1 / -1; display: flex; gap: 8px; align-items: center; font-size: 11px; opacity: .7; }
.qcard .meta input { border: 0; background: none; color: inherit; font: inherit; padding: 0; }
.del { width: 26px; height: 26px; border-radius: 50%; font-size: 16px; opacity: .6; }
.del:hover { opacity: 1; }
.del.confirm { width: auto; padding: 0 10px; font-size: 12px; background: #B4544A; color: #fff; opacity: 1; border-radius: 999px; }
.none { color: var(--muted); font-size: 14px; text-align: center; padding: 24px 0; }

/* avatar crop */
.crop { position: fixed; inset: 0; z-index: 10; background: rgba(10, 12, 14, .72); display: grid; place-items: center; padding: 16px; }
.crop-box { width: min(340px, 100%); background: var(--paper-2); border-radius: 22px; padding: 18px; display: flex; flex-direction: column; align-items: center; gap: 12px; }
.crop-box h2 { margin: 0; font-family: var(--font-display); font-size: 17px; font-weight: 600; }
.stage { position: relative; width: 260px; height: 260px; max-width: 100%; overflow: hidden; border-radius: 12px; background: #111; touch-action: none; cursor: grab; }
.stage:active { cursor: grabbing; }
.stage img { position: absolute; left: 0; top: 0; transform-origin: 0 0; user-select: none; -webkit-user-drag: none; max-width: none; }
.stage .mask { position: absolute; inset: 0; pointer-events: none; border-radius: 50%; box-shadow: 0 0 0 200px rgba(0, 0, 0, .55); outline: 2px solid rgba(255,255,255,.8); outline-offset: -1px; }
.zoom-row { display: flex; align-items: center; gap: 10px; width: 100%; color: var(--muted); }
.zoom-row input { flex: 1; accent-color: var(--lamp); }
.crop-tip { margin: -4px 0 0; font-size: 12px; color: var(--muted); }
.crop-actions { display: flex; gap: 10px; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translateX(-50%); z-index: 30;
  background: var(--ink); color: var(--paper); padding: 9px 16px; border-radius: 999px; font-size: 13px; opacity: 0; transition: opacity .2s; pointer-events: none; max-width: calc(100% - 32px); text-align: center; }
.toast.show { opacity: 1; }
@media (prefers-reduced-motion: reduce) { .toast { transition: none; } }
</style>
</head>
<body>
<div class="scene" aria-hidden="true"></div>

<div class="gate" id="gate" hidden>
  <form class="gate-box" id="gateForm">
    <div class="mark">SHEN<sup>2</sup> EVAN</div>
    <p>这里只住两个人</p>
    <label class="sr" for="gatePwd">访问密码</label>
    <input type="password" id="gatePwd" placeholder="访问密码" autocomplete="current-password">
    <button type="submit">进门</button>
    <div class="gate-error" id="gateError" role="alert"></div>
  </form>
</div>

<div class="page" id="page" hidden>
  <header class="topbar">
    <div class="hello" id="hello">&nbsp;</div>
    <button class="gear" type="button" aria-label="设置" aria-expanded="false" id="gear">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="3"/><path d="M19.4 15a1.7 1.7 0 0 0 .3 1.8l.1.1a2 2 0 1 1-2.8 2.8l-.1-.1a1.7 1.7 0 0 0-1.8-.3 1.7 1.7 0 0 0-1 1.5V21a2 2 0 1 1-4 0v-.1a1.7 1.7 0 0 0-1.1-1.5 1.7 1.7 0 0 0-1.8.3l-.1.1a2 2 0 1 1-2.8-2.8l.1-.1a1.7 1.7 0 0 0 .3-1.8 1.7 1.7 0 0 0-1.5-1H3a2 2 0 1 1 0-4h.1a1.7 1.7 0 0 0 1.5-1.1 1.7 1.7 0 0 0-.3-1.8l-.1-.1a2 2 0 1 1 2.8-2.8l.1.1a1.7 1.7 0 0 0 1.8.3H9a1.7 1.7 0 0 0 1-1.5V3a2 2 0 1 1 4 0v.1a1.7 1.7 0 0 0 1 1.5 1.7 1.7 0 0 0 1.8-.3l.1-.1a2 2 0 1 1 2.8 2.8l-.1.1a1.7 1.7 0 0 0-.3 1.8V9a1.7 1.7 0 0 0 1.5 1H21a2 2 0 1 1 0 4h-.1a1.7 1.7 0 0 0-1.5 1z"/></svg>
    </button>
    <div class="gear-menu" id="gearMenu" hidden>
      <div class="gm-label">外观</div>
      <div class="seg" role="radiogroup" aria-label="外观">
        <button type="button" role="radio" data-look="auto" aria-checked="true">跟着时间</button>
        <button type="button" role="radio" data-look="light" aria-checked="false">鼠尾草</button>
        <button type="button" role="radio" data-look="dark" aria-checked="false">夜灯</button>
      </div>
      <div class="gm-hint">跟着时间：北京时间 7–19 点鼠尾草，其余夜灯</div>
      <div class="gm-label gm-sep">他的头像</div>
      <div class="bg-row">
        <span class="bg-thumb av-thumb" aria-hidden="true"></span>
        <label class="bg-btn" for="avFile">换一张</label>
        <input id="avFile" type="file" accept="image/*" class="sr">
        <button type="button" class="bg-btn ghost" id="avReset">用默认</button>
      </div>
      <div class="gm-label gm-sep">背景</div>
      <div class="bg-row">
        <span class="bg-thumb" aria-hidden="true"></span>
        <label class="bg-btn" for="bgFile">换一张</label>
        <input id="bgFile" type="file" accept="image/*" class="sr">
        <button type="button" class="bg-btn ghost" id="bgReset">用默认</button>
      </div>
      <div class="gm-hint">白天和晚上会自动叠上对应的遮罩</div>
      <nav class="gm-links" aria-label="更多">
        <a class="gm-item" href="/admin/providers">模型切换 <span aria-hidden="true">›</span></a>
        <a class="gm-item" href="/letters">信箱 <span aria-hidden="true">›</span></a>
        <a class="gm-item" href="/play">Play <span aria-hidden="true">›</span></a>
        <button type="button" class="gm-item" id="logout">退出登录</button>
      </nav>
    </div>
  </header>

  <section class="him" aria-label="他此刻">
    <div class="who">
      <div class="avatar" aria-hidden="true"><div class="face"></div></div>
      <div class="name">Evan <span class="status"><i class="dot"></i>在 · <span id="mood">……</span></span></div>
    </div>
    <p class="sig" id="sig">&nbsp;</p>
    <div class="weather" id="weather"></div>

    <div class="said">
      <div class="when" id="saidWhen">他来找过你</div>
      <div class="bubble" id="saidBubble" hidden></div>
      <div class="quiet" id="saidQuiet" hidden>他还没主动来找过你。</div>
      <button class="poke" type="button" id="poke">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M18 11V6a2 2 0 0 0-4 0v5M14 10V4a2 2 0 0 0-4 0v6M10 10.5V6a2 2 0 0 0-4 0v8"/><path d="M18 8a2 2 0 1 1 4 0v6a8 8 0 0 1-8 8h-2c-2.8 0-4.5-.9-5.9-2.3l-3.6-3.6a2 2 0 0 1 2.8-2.8L7 15"/></svg>
        <span id="pokeLabel">戳他一下</span>
      </button>
    </div>
  </section>

  <nav class="doors" aria-label="去做事">
    <a class="chat-door" href="/chat">
      <span class="ic"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12a8 8 0 0 1-11.7 7.1L4 20l1-4.6A8 8 0 1 1 21 12z"/></svg></span>
      <span class="txt"><strong>去找他聊天</strong><span>在网页上和他说话</span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <div class="small-doors">
      <button class="door" type="button" id="callMe"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M22 16.9v3a2 2 0 0 1-2.2 2 19.8 19.8 0 0 1-8.6-3.1 19.5 19.5 0 0 1-6-6A19.8 19.8 0 0 1 2.1 4.2 2 2 0 0 1 4.1 2h3a2 2 0 0 1 2 1.7c.1.9.4 1.8.7 2.7a2 2 0 0 1-.5 2.1L8 9.8a16 16 0 0 0 6 6l1.3-1.3a2 2 0 0 1 2.1-.4c.9.3 1.8.6 2.7.7a2 2 0 0 1 1.7 2z"/></svg></span>打给我</button>
      <a class="door" href="/admin/gallery"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="9" cy="9" r="2"/><path d="M21 15l-5-5L5 21"/></svg></span>画廊</a>
      <a class="door" href="/dashboard/evan"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12h4l2.5-6 4 13 3-9 1.5 2H22"/></svg></span>此刻</a>
      <a class="door" href="/diary"><span class="ring"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19.5A2.5 2.5 0 0 1 6.5 17H20V3H6.5A2.5 2.5 0 0 0 4 5.5z"/><path d="M4 19.5A2.5 2.5 0 0 0 6.5 22H20v-5"/></svg></span>日记</a>
    </div>
  </nav>

  <section aria-label="我们之间">
    <div class="head"><h2>我们之间</h2></div>
    <div class="days"><span class="n" id="days">—</span><span class="t">天</span><span class="since">从 2026 年 2 月 28 日起</span></div>
    <div class="journal">
      <div class="journal-head"><span>今天记下的</span><span id="memCount"></span></div>
      <ul id="memList"><li class="empty">正在翻……</li></ul>
      <a class="more" href="/dashboard">进记忆库 ›</a>
    </div>
    <div class="polaroids" id="polaroids" hidden></div>
  </section>

  <section aria-label="He says">
    <div class="head"><h2>He says</h2><small id="quoteCount"></small></div>
    <div class="write">
      <label for="quote-input" class="sr">记下他说的话</label>
      <textarea id="quote-input" placeholder="他又说了什么，记下来"></textarea>
      <div class="write-row">
        <label class="sr" for="quote-src">来源</label>
        <select id="quote-src" class="mini"><option value="tg">TG</option><option value="cc">CC</option><option value="app">App</option><option value="kelivo">Kelivo</option></select>
        <label class="sr" for="quote-date">日期</label>
        <input id="quote-date" class="mini" type="date">
        <button class="save" type="button" id="save">贴上去</button>
      </div>
    </div>
    <div class="notes" id="latest"></div>
    <button class="more" type="button" id="openAll" hidden>看全部 ›</button>
  </section>
</div>

<div class="sheet" id="allSheet" hidden role="dialog" aria-modal="true" aria-labelledby="allTitle">
  <div class="sheet-inner">
    <header class="sheet-head">
      <button class="back" type="button" id="closeAll" aria-label="返回主页">‹</button>
      <h2 id="allTitle">He says</h2>
      <button class="shuffle" type="button" id="shuffle">随机翻一句</button>
    </header>
    <label class="sr" for="quote-search">搜索他说过的话</label>
    <input id="quote-search" class="search" type="search" placeholder="搜一句">
    <div class="all-list" id="allList"></div>
  </div>
</div>

<div class="crop" id="crop" hidden role="dialog" aria-modal="true" aria-labelledby="cropTitle">
  <div class="crop-box">
    <h2 id="cropTitle">把他的脸放进圈里</h2>
    <div class="stage" id="stage"><img id="cropImg" alt="" draggable="false"><div class="mask" aria-hidden="true"></div></div>
    <label class="zoom-row" for="zoom"><span aria-hidden="true">－</span><input id="zoom" type="range" min="1" max="4" step="0.01" value="1" aria-label="缩放"><span aria-hidden="true">＋</span></label>
    <p class="crop-tip">拖动移位置，两指或滑条缩放</p>
    <div class="crop-actions"><button type="button" class="bg-btn ghost" id="cropCancel">取消</button><button type="button" class="bg-btn" id="cropOk">好了</button></div>
  </div>
</div>

<audio id="voiceAudio" preload="none"></audio>
<div class="toast" id="toast" role="status" aria-live="polite"></div>

<script>
(function () {
  const $ = (id) => document.getElementById(id);
  const ANCHOR = Date.UTC(2026, 1, 27, 16, 0, 0);  // 2026-02-28 00:00 北京时间，在一起的第一天
  const PAGE_HEADERS = { 'X-Evan-Page': '1' };

  // ---------- 小工具 ----------
  let toastTimer;
  function say(msg) { const t = $('toast'); t.textContent = msg; t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(() => t.classList.remove('show'), 2200); }
  const esc = (s) => String(s ?? '').replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const bj = (d) => new Date(d.getTime() + 8 * 3600 * 1000);  // 之后用 getUTC* 读出北京时间
  const pad = (n) => String(n).padStart(2, '0');
  const bjDateStr = (d) => { const b = bj(d); return `${b.getUTCFullYear()}-${pad(b.getUTCMonth() + 1)}-${pad(b.getUTCDate())}`; };
  const hm = (d) => { const b = bj(d); return `${pad(b.getUTCHours())}:${pad(b.getUTCMinutes())}`; };
  function whenText(d) {
    const day = bjDateStr(d);
    if (day === bjDateStr(new Date())) return hm(d);
    if (day === bjDateStr(new Date(Date.now() - 86400000))) return `昨天 ${hm(d)}`;
    const b = bj(d);
    return `${b.getUTCMonth() + 1} 月 ${b.getUTCDate()} 日`;
  }
  function parseServerTime(s) {
    if (!s) return null;
    const d = /[Zz]|[+-]\d{2}:\d{2}$/.test(s) ? new Date(s) : new Date(s + 'Z');
    return isNaN(d) ? null : d;
  }
  async function getJson(url) {
    const r = await fetch(url, { credentials: 'same-origin', cache: 'no-store' });
    if (r.status === 401) { showGate(); throw new Error('login'); }
    const type = r.headers.get('content-type') || '';
    if (!r.ok || !type.includes('json')) throw new Error(`HTTP ${r.status}`);
    return r.json();
  }

  // ---------- 外观、招呼、天数 ----------
  const segBtns = document.querySelectorAll('.seg button');
  let look = 'auto';
  try { look = localStorage.getItem('homeLook') || 'auto'; } catch (e) {}
  function applyLook() {
    const b = bj(new Date()), h = b.getUTCHours();
    const theme = look === 'auto' ? (h >= 7 && h < 19 ? 'light' : 'dark') : look;
    document.documentElement.dataset.theme = theme;
    $('themeColor').content = theme === 'dark' ? '#111726' : '#E9EDE2';
    segBtns.forEach(x => x.setAttribute('aria-checked', String(x.dataset.look === look)));
    const greet = h < 5 ? '这么晚还没睡' : h < 11 ? '早上好' : h < 14 ? '中午好' : h < 19 ? '下午好' : '晚上好';
    $('hello').innerHTML = `${greet}，<b>深深</b> · ${b.getUTCMonth() + 1} 月 ${b.getUTCDate()} 日`;
    $('days').textContent = Math.floor((Date.now() - ANCHOR) / 86400000) + 1;
  }
  segBtns.forEach(x => x.addEventListener('click', () => { look = x.dataset.look; try { localStorage.setItem('homeLook', look); } catch (e) {} applyLook(); }));
  applyLook();

  // ---------- 齿轮菜单 ----------
  const gearMenu = $('gearMenu'), gearBtn = $('gear');
  document.addEventListener('click', e => {
    if (gearBtn.contains(e.target)) { gearMenu.hidden = !gearMenu.hidden; gearBtn.setAttribute('aria-expanded', String(!gearMenu.hidden)); return; }
    if (!gearMenu.contains(e.target) && !$('crop').contains(e.target)) { gearMenu.hidden = true; gearBtn.setAttribute('aria-expanded', 'false'); }
  });
  $('logout').addEventListener('click', async () => {
    await fetch('/auth/logout', { method: 'POST' }).catch(() => {});
    gearMenu.hidden = true; showGate();
  });

  // ---------- 头像、背景（存在服务器上，换一次所有设备都变） ----------
  const rootStyle = document.documentElement.style;
  function refreshAvatar() { rootStyle.setProperty('--avatar', `url("/admin/api/home/avatar?v=${Date.now()}")`); }
  function refreshBackground() {
    const url = `/admin/api/home/background?v=${Date.now()}`;
    const probe = new Image();
    probe.onload = () => { rootStyle.setProperty('--bg-img', `url("${url}")`); rootStyle.setProperty('--bg-pos', 'center'); };
    probe.onerror = () => { rootStyle.removeProperty('--bg-img'); rootStyle.removeProperty('--bg-pos'); };
    probe.src = url;
  }
  async function upload(kind, blob) {
    const r = await fetch(`/admin/api/home/${kind}`, { method: 'POST', headers: PAGE_HEADERS, body: blob });
    if (!r.ok) { let m = ''; try { m = (await r.json()).message; } catch (e) {} throw new Error(m || `HTTP ${r.status}`); }
  }
  const canvasBlob = (c, q) => new Promise((res, rej) => c.toBlob(b => (b ? res(b) : rej(new Error('图片处理失败'))), 'image/jpeg', q));
  function loadImage(file) {
    return new Promise((res, rej) => { const url = URL.createObjectURL(file); const img = new Image(); img.onload = () => res({ img, url }); img.onerror = () => { URL.revokeObjectURL(url); rej(new Error('这张图打不开，换一张试试')); }; img.src = url; });
  }
  $('bgFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const { img, url } = await loadImage(file);
      const k = Math.min(1, 1600 / Math.max(img.width, img.height));
      const c = document.createElement('canvas'); c.width = Math.round(img.width * k); c.height = Math.round(img.height * k);
      c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url);
      await upload('background', await canvasBlob(c, 0.85));
      refreshBackground(); say('背景换好了');
    } catch (err) { say(`没换成：${err.message}`); }
  });
  $('bgReset').addEventListener('click', async () => {
    await fetch('/admin/api/home/background', { method: 'DELETE', headers: PAGE_HEADERS }).catch(() => {});
    refreshBackground(); say('换回雪松了');
  });
  $('avReset').addEventListener('click', async () => {
    await fetch('/admin/api/home/avatar', { method: 'DELETE', headers: PAGE_HEADERS }).catch(() => {});
    refreshAvatar(); say('换回原来的头像了');
  });

  // 头像裁剪：拖动 + 两指/滑条/滚轮缩放，按圆框裁成 512px
  const crop = $('crop'), stage = $('stage'), cImg = $('cropImg'), zoom = $('zoom');
  let st = null; const pts = new Map(); let pinch0 = null;
  function clampPos() {
    const sc = st.base * st.k;
    st.x = Math.min(0, Math.max(st.S - st.w * sc, st.x));
    st.y = Math.min(0, Math.max(st.S - st.h * sc, st.y));
    cImg.style.transform = `translate(${st.x}px, ${st.y}px) scale(${sc})`;
  }
  function zoomTo(k, cx, cy) {
    k = Math.min(4, Math.max(1, k));
    const old = st.base * st.k, nw = st.base * k;
    st.x = cx - (cx - st.x) * nw / old; st.y = cy - (cy - st.y) * nw / old; st.k = k;
    zoom.value = k; clampPos();
  }
  $('avFile').addEventListener('change', async e => {
    const file = e.target.files && e.target.files[0]; e.target.value = '';
    if (!file) return;
    try {
      const { img, url } = await loadImage(file);
      crop.hidden = false;
      const S = stage.clientWidth, base = S / Math.min(img.width, img.height);
      st = { w: img.width, h: img.height, S, base, k: 1, x: (S - img.width * base) / 2, y: (S - img.height * base) / 2, url };
      cImg.src = url; cImg.style.width = img.width + 'px'; cImg.style.height = img.height + 'px';
      zoom.value = 1; clampPos();
    } catch (err) { say(err.message); }
  });
  stage.addEventListener('pointerdown', e => { if (!st) return; stage.setPointerCapture(e.pointerId); pts.set(e.pointerId, { x: e.clientX, y: e.clientY }); if (pts.size === 2) { const [a, b] = [...pts.values()]; pinch0 = { d: Math.hypot(a.x - b.x, a.y - b.y), k: st.k }; } });
  stage.addEventListener('pointermove', e => {
    if (!st || !pts.has(e.pointerId)) return;
    const prev = pts.get(e.pointerId), cur = { x: e.clientX, y: e.clientY }; pts.set(e.pointerId, cur);
    if (pts.size === 1) { st.x += cur.x - prev.x; st.y += cur.y - prev.y; clampPos(); }
    else if (pts.size === 2 && pinch0) { const [a, b] = [...pts.values()]; const r = stage.getBoundingClientRect(); zoomTo(pinch0.k * Math.hypot(a.x - b.x, a.y - b.y) / pinch0.d, (a.x + b.x) / 2 - r.left, (a.y + b.y) / 2 - r.top); }
  });
  const lift = e => { pts.delete(e.pointerId); if (pts.size < 2) pinch0 = null; };
  stage.addEventListener('pointerup', lift); stage.addEventListener('pointercancel', lift);
  stage.addEventListener('wheel', e => { if (!st) return; e.preventDefault(); const r = stage.getBoundingClientRect(); zoomTo(st.k * (e.deltaY < 0 ? 1.08 : 1 / 1.08), e.clientX - r.left, e.clientY - r.top); }, { passive: false });
  zoom.addEventListener('input', () => { if (st) zoomTo(Number(zoom.value), st.S / 2, st.S / 2); });
  function closeCrop() { crop.hidden = true; if (st) URL.revokeObjectURL(st.url); st = null; pts.clear(); pinch0 = null; }
  $('cropCancel').addEventListener('click', closeCrop);
  $('cropOk').addEventListener('click', async () => {
    if (!st) return;
    const sc = st.base * st.k;
    const c = document.createElement('canvas'); c.width = c.height = 512;
    c.getContext('2d').drawImage(cImg, -st.x / sc, -st.y / sc, st.S / sc, st.S / sc, 0, 0, 512, 512);
    try { await upload('avatar', await canvasBlob(c, 0.9)); closeCrop(); refreshAvatar(); say('头像换好了'); }
    catch (err) { say(`没换成：${err.message}`); }
  });

  // ---------- 他此刻 ----------
  const voiceAudio = $('voiceAudio');
  const PLAY_ICON = '<svg viewBox="0 0 10 10" fill="currentColor"><path d="M2 1l7 4-7 4z"/></svg>';
  const PAUSE_ICON = '<svg viewBox="0 0 10 10" fill="currentColor"><rect x="2" y="1" width="2.2" height="8"/><rect x="5.8" y="1" width="2.2" height="8"/></svg>';
  let shownProactiveAt = null;
  function renderProactive(p) {
    const bubble = $('saidBubble'), quiet = $('saidQuiet');
    if (!p || !p.text) { bubble.hidden = true; quiet.hidden = false; $('saidWhen').textContent = '他来找过你'; return; }
    quiet.hidden = true; bubble.hidden = false;
    $('saidWhen').textContent = `他 ${whenText(new Date(p.at))} 来找过你`;
    if (shownProactiveAt === p.at) return;
    shownProactiveAt = p.at;
    voiceAudio.pause();
    let html = esc(p.text);
    if (p.voice) {
      const bars = [7, 14, 9, 17, 6, 12, 8, 15, 5].map(h => `<i style="height:${h}px"></i>`).join('');
      html += `<div class="voice" id="voiceRow"><button class="play" type="button" id="voicePlay" aria-label="播放他的语音">${PLAY_ICON}</button><span class="wave" aria-hidden="true">${bars}</span><small id="voiceLen">语音</small></div>`;
      voiceAudio.src = `/admin/api/home/voice?v=${p.at}`;
      voiceAudio.preload = 'metadata';
    } else {
      voiceAudio.removeAttribute('src');
    }
    bubble.innerHTML = html;
    if (p.voice) $('voicePlay').addEventListener('click', () => {
      if (voiceAudio.paused) voiceAudio.play().catch(() => say('语音放不出来，刷新试试')); else voiceAudio.pause();
    });
  }
  function syncVoiceUi() {
    const row = $('voiceRow'), btn = $('voicePlay');
    if (!row || !btn) return;
    const playing = !voiceAudio.paused && !voiceAudio.ended;
    row.classList.toggle('playing', playing);
    btn.innerHTML = playing ? PAUSE_ICON : PLAY_ICON;
    btn.setAttribute('aria-label', playing ? '暂停' : '播放他的语音');
  }
  ['play', 'pause', 'ended'].forEach(ev => voiceAudio.addEventListener(ev, syncVoiceUi));
  voiceAudio.addEventListener('loadedmetadata', () => {
    const s = Math.round(voiceAudio.duration);
    if ($('voiceLen') && isFinite(s)) $('voiceLen').textContent = `${Math.floor(s / 60)}:${pad(s % 60)}`;
  });

  async function loadHome() {
    try {
      const d = await getJson('/admin/api/home');
      const sig = $('sig');
      if (d.bio && d.bio.bio) { sig.textContent = d.bio.bio; sig.classList.remove('empty'); }
      else { sig.textContent = '他还没写签名'; sig.classList.add('empty'); }
      const w = [];
      if (d.bio && d.bio.ts) w.push(`${whenText(new Date(d.bio.ts))} 换的签名`);
      if (d.weather && d.weather.place) w.push(`${d.weather.place} ${d.weather.temp}° ${d.weather.text}`);
      $('weather').innerHTML = w.map(x => `<span>${esc(x)}</span>`).join('');
      renderProactive(d.proactive);
      const box = $('polaroids');
      if (d.drawings && d.drawings.length) {
        box.hidden = false;
        box.innerHTML = d.drawings.map(x => `<a class="polaroid" href="/admin/gallery"><img src="/admin/api/home/drawing?id=${encodeURIComponent(x.id)}" alt="他画的画" loading="lazy"><figcaption>${esc(whenText(new Date(x.ts)))}</figcaption></a>`).join('');
      } else box.hidden = true;
    } catch (e) {
      if (e.message !== 'login' && !$('sig').textContent.trim()) $('sig').textContent = '他那边暂时没连上';
    }
  }
  async function loadMood() {
    try { const s = await getJson('/api/state'); $('mood').textContent = s.tag || '在自己的节奏里'; }
    catch (e) { if ($('mood').textContent === '……') $('mood').textContent = '在自己的节奏里'; }
  }

  $('poke').addEventListener('click', async () => {
    const btn = $('poke'); if (btn.disabled) return;
    btn.disabled = true;
    let label = '没戳到';
    try {
      const r = await fetch('/api/poke', { method: 'POST' });
      if (r.status === 401) { showGate(); btn.disabled = false; return; }
      const d = await r.json();
      label = d.ok ? '戳到了' : (d.msg || '没戳到');
      if (d.ok) loadMood();
    } catch (e) {}
    $('pokeLabel').textContent = label;
    setTimeout(() => { $('pokeLabel').textContent = '戳他一下'; btn.disabled = false; }, 8000);
  });

  $('callMe').addEventListener('click', async () => {
    try {
      const r = await fetch('/admin/api/home/call', { method: 'POST', headers: PAGE_HEADERS });
      if (!r.ok) throw new Error(String(r.status));
      const d = await r.json();
      say(d.busy ? '已经在响了，去 TG 接' : '他在打给你了，去 TG 接');
    } catch (e) { say('没打出去，过一会儿再试'); }
  });

  // ---------- 今天记下的 ----------
  async function loadMemories() {
    const ul = $('memList');
    try {
      const buckets = await getJson('/api/buckets');
      const today = bjDateStr(new Date());
      const todays = (Array.isArray(buckets) ? buckets : [])
        .map(b => ({ ...b, t: parseServerTime(b.created) }))
        .filter(b => b.t && bjDateStr(b.t) === today)
        .sort((a, b) => b.t - a.t);
      $('memCount').textContent = todays.length ? `${todays.length} 条` : '';
      ul.innerHTML = todays.length
        ? todays.slice(0, 5).map(b => `<li><span class="mt">${hm(b.t)}</span><div><b>${esc(b.name)}</b><span>${esc(b.content_preview)}</span></div></li>`).join('')
        : '<li class="empty">今天还没有记忆落进井里。</li>';
    } catch (e) {
      if (e.message !== 'login') ul.innerHTML = '<li class="empty">没翻开，刷新试试。</li>';
    }
  }

  // ---------- He says ----------
  let quotes = [];
  const SRC = { tg: 'TG', cc: 'CC', app: 'App', kelivo: 'Kelivo' };
  const qDate = (q) => (q.created || '').slice(0, 10);
  const shortDate = (d) => (d ? `${Number(d.slice(5, 7))} 月 ${Number(d.slice(8, 10))} 日` : '');
  const srcLabel = (s) => SRC[String(s || '').toLowerCase()] || String(s || '').toUpperCase();
  function renderLatest() {
    $('quoteCount').textContent = quotes.length ? `共 ${quotes.length} 句` : '';
    $('openAll').hidden = !quotes.length;
    $('openAll').textContent = `看全部 ${quotes.length} 句 ›`;
    $('latest').innerHTML = quotes.length
      ? quotes.slice(0, 3).map(q => `<div class="note">${esc(q.text)}<div class="meta">${esc(srcLabel(q.source))} · ${shortDate(qDate(q))}</div></div>`).join('')
      : '<div class="none">还没贴。他下次说出经典的话，记下来。</div>';
  }
  async function loadQuotes() {
    try {
      const d = await getJson('/api/quotes');
      quotes = (d.quotes || []).slice().sort((a, b) => (b.created || '').localeCompare(a.created || ''));
      renderLatest();
      if (!$('allSheet').hidden) renderAll();
    } catch (e) { if (e.message !== 'login') $('latest').innerHTML = '<div class="none">没翻开，刷新试试。</div>'; }
  }
  async function quoteOp(body) {
    const r = await fetch('/api/quotes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
    if (r.status === 401) { showGate(); return false; }
    return r.ok;
  }
  $('save').addEventListener('click', async () => {
    const box = $('quote-input'); const text = box.value.trim();
    if (!text) { say('先写下他说的话'); return; }
    if (await quoteOp({ op: 'add', text, source: $('quote-src').value, date: $('quote-date').value })) { box.value = ''; say('贴好了'); loadQuotes(); }
    else say('没贴上，再试一次');
  });

  const sheet = $('allSheet'), allList = $('allList'), search = $('quote-search');
  function renderAll() {
    const term = search.value.trim();
    const list = term ? quotes.filter(q => (q.text || '').includes(term)) : quotes;
    if (!list.length) { allList.innerHTML = `<div class="none">${term ? '没搜到这句' : '还没贴'}</div>`; return; }
    let html = '', month = '';
    for (const q of list) {
      const d = qDate(q), m = d.slice(0, 7);
      if (m && m !== month) { month = m; html += `<div class="month">${m.slice(0, 4)} 年 ${Number(m.slice(5))} 月</div>`; }
      html += `<div class="qcard" data-id="${esc(q.id)}"><q>${esc(q.text)}</q><button class="del" type="button" data-del="${esc(q.id)}" aria-label="删除这句">×</button>` +
        `<div class="meta"><span>${esc(srcLabel(q.source))}</span><input type="date" value="${esc(d)}" aria-label="改日期" data-date="${esc(q.id)}"></div></div>`;
    }
    allList.innerHTML = html;
  }
  $('openAll').addEventListener('click', () => { search.value = ''; renderAll(); sheet.hidden = false; document.body.style.overflow = 'hidden'; });
  $('closeAll').addEventListener('click', () => { sheet.hidden = true; document.body.style.overflow = ''; });
  search.addEventListener('input', renderAll);
  // 删除要点两下：第一下变成"删除"，第二下才删
  allList.addEventListener('click', async e => {
    const btn = e.target.closest('[data-del]'); if (!btn) return;
    if (!btn.classList.contains('confirm')) {
      allList.querySelectorAll('.del.confirm').forEach(b => { b.classList.remove('confirm'); b.textContent = '×'; });
      btn.classList.add('confirm'); btn.textContent = '删除'; return;
    }
    if (await quoteOp({ op: 'remove', id: btn.dataset.del })) { say('撕掉了'); loadQuotes(); } else say('没删掉，再试一次');
  });
  allList.addEventListener('change', async e => {
    const id = e.target.dataset.date; if (!id || !e.target.value) return;
    if (await quoteOp({ op: 'redate', id, date: e.target.value })) { say('日期改好了'); loadQuotes(); }
  });
  $('shuffle').addEventListener('click', () => {
    if (!quotes.length) return;
    search.value = ''; renderAll();
    const q = quotes[Math.floor(Math.random() * quotes.length)];
    const card = allList.querySelector(`[data-id="${CSS.escape(String(q.id))}"]`);
    if (!card) return;
    card.scrollIntoView({ block: 'center', behavior: matchMedia('(prefers-reduced-motion: reduce)').matches ? 'auto' : 'smooth' });
    card.classList.add('flash'); setTimeout(() => card.classList.remove('flash'), 1400);
  });

  // ---------- 登录 ----------
  function showGate() { $('page').hidden = true; $('gate').hidden = false; setTimeout(() => $('gatePwd').focus(), 50); }
  $('gateForm').addEventListener('submit', async e => {
    e.preventDefault();
    $('gateError').textContent = '';
    try {
      const r = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: $('gatePwd').value }) });
      if (r.ok) { $('gatePwd').value = ''; start(); return; }
      let m = '密码不对'; try { m = (await r.json()).error || m; } catch (err) {}
      $('gateError').textContent = m;
    } catch (err) { $('gateError').textContent = '连不上，过一会儿再试'; }
  });

  // ---------- 启动 ----------
  let timer = null;
  function loadAll() { loadHome(); loadMood(); loadMemories(); loadQuotes(); refreshAvatar(); refreshBackground(); }
  function start() {
    $('gate').hidden = true; $('page').hidden = false;
    $('quote-date').value = bjDateStr(new Date());
    loadAll();
    clearInterval(timer);
    // 开着的时候每分钟刷新：他刚来找过你、心情、今天的记忆、外观随时间变
    timer = setInterval(() => { if (document.hidden) return; applyLook(); loadHome(); loadMood(); loadMemories(); }, 60000);
  }
  document.addEventListener('visibilitychange', () => { if (!document.hidden && !$('page').hidden) { applyLook(); loadHome(); loadMood(); } });
  (async () => {
    try { const s = await (await fetch('/auth/status', { cache: 'no-store' })).json(); if (!s.authenticated) { showGate(); return; } } catch (e) {}
    start();
  })();
})();
</script>
</body>
</html>
