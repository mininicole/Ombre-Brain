<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>SHEN² EVAN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,500;0,600;1,500;1,600&family=Caveat:wght@500&display=swap" rel="stylesheet">
<style>
  :root {
    --paper: #F4F1E5;
    --card: #FEFDF8;
    --tile: #F4F0E2;
    --ink: #2A2722;
    --ink-soft: #6B665A;
    --ink-faint: #9B9588;
    --clay: #D2674A;
    --line: rgba(42,39,34,0.10);
    --display: "Playfair Display", ui-serif, Georgia, serif;
    --script: "Caveat", cursive;
    --cjk: "Songti SC", "Noto Serif SC", "SimSun", serif;
    --serif: ui-serif, Georgia, "Songti SC", "Noto Serif SC", "SimSun", serif;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html { background: var(--paper); }
  body {
    font-family: var(--serif);
    color: var(--ink);
    background: var(--paper);
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  .page {
    max-width: 520px; margin: 0 auto;
    padding: 0 18px calc(110px + env(safe-area-inset-bottom));
  }

  /* ---- top bar ---- */
  .topbar {
    display: flex; justify-content: space-between; align-items: center;
    padding: 22px 4px 0;
  }
  .topbar .date {
    font-family: var(--display);
    font-size: 15px; letter-spacing: 0.03em; color: var(--ink);
  }
  .topbar .date b { color: var(--clay); font-weight: 500; }
  .topbar .gear { background: none; border: none; cursor: pointer; color: var(--ink-soft); padding: 6px; display: flex; }
  .topbar .gear:hover { color: var(--ink); }

  /* ---- hero lockup ----
     字标和 tab 图标都是深深在 PS 里画的原图（base64 内嵌）。
     不要用代码字体/SVG 复刻它们。 */
  .hero { padding: 56px 0 58px; }
  .hero .lockup { width: 100%; display: block; }

  /* ---- bento ---- */
  .bento { display: grid; grid-template-columns: 1fr 1fr; gap: 14px; }
  .b-card {
    background: var(--card); border: 1px solid var(--line); border-radius: 22px;
    padding: 18px 16px; position: relative; overflow: hidden;
  }
  .b-today { grid-column: 1; grid-row: 1 / 3; min-height: 480px; }
  .b-pulse { grid-column: 2; grid-row: 1; min-height: 150px; display: flex; flex-direction: column; }
  .b-days  { grid-column: 2; grid-row: 2; }
  .b-murmurs { grid-column: 1 / 3; grid-row: 3; }
  .b-todo { grid-column: 1 / 3; grid-row: 4; }

  /* todo */
  .todo-add { display: flex; gap: 10px; margin: 10px 0 14px; }
  .todo-add input {
    flex: 1; padding: 9px 13px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--tile); font-family: var(--serif); font-size: 13px; color: var(--ink); outline: none;
  }
  .todo-add input:focus { border-color: var(--clay); }
  .todo-add button {
    padding: 9px 18px; border: none; border-radius: 12px; background: var(--ink);
    color: var(--paper); font-family: var(--serif); font-size: 13px; letter-spacing: 0.1em; cursor: pointer;
  }
  .todo-add button:hover { background: var(--clay); }
  .todo-item { display: flex; align-items: baseline; gap: 11px; padding: 8px 2px; border-bottom: 1px solid var(--line); }
  .todo-item:last-child { border-bottom: none; }
  .todo-box {
    width: 15px; height: 15px; flex: none; align-self: center;
    border: 1.5px solid var(--ink-soft); border-radius: 4px; cursor: pointer; position: relative;
  }
  .todo-item.done .todo-box { border-color: var(--clay); background: var(--clay); }
  .todo-item.done .todo-box::after {
    content: '✓'; position: absolute; inset: 0; color: var(--paper);
    font-size: 11px; line-height: 13px; text-align: center;
  }
  .todo-text { flex: 1; font-size: 13.5px; line-height: 1.7; word-break: break-word; }
  .todo-item.done .todo-text { color: var(--ink-faint); text-decoration: line-through; }
  .todo-del { background: none; border: none; color: var(--ink-faint); cursor: pointer; font-size: 15px; padding: 0 4px; }
  .todo-del:hover { color: var(--clay); }

  .sug-head { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.16em; margin: 16px 0 6px; }
  .sug { display: flex; align-items: baseline; gap: 9px; padding: 7px 2px; }
  .sug .todo-text { color: var(--ink-soft); font-style: italic; }
  .sug .from { font-size: 10.5px; color: var(--ink-faint); white-space: nowrap; }
  .sug button {
    background: none; border: 1px solid var(--line); border-radius: 9px; cursor: pointer;
    font-family: var(--cjk); font-size: 11px; color: var(--ink-soft); padding: 3px 9px; white-space: nowrap;
  }
  .sug button:hover { border-color: var(--clay); color: var(--clay); }

  .b-label {
    font-family: var(--display); font-weight: 600;
    font-size: 19px; color: var(--clay); margin-bottom: 6px; white-space: nowrap;
  }
  .b-label .zh {
    font-family: var(--cjk); font-weight: 600;
    font-size: 12px; color: var(--ink); margin-left: 6px; letter-spacing: 0.1em;
  }
  .ghost {
    position: absolute; left: 50%; bottom: -6%; transform: translateX(-46%);
    font-family: var(--display); font-weight: 500;
    font-size: 280px; line-height: 0.8; color: rgba(210,103,74,0.06);
    pointer-events: none; user-select: none;
  }

  .b-scroll { position: relative; z-index: 1; margin-top: 8px; overflow-y: auto; scrollbar-width: none; }
  .b-scroll::-webkit-scrollbar { display: none; }
  .b-today .b-scroll { max-height: 420px; }

  .mem { padding: 9px 0; border-bottom: 1px solid var(--line); }
  .mem:last-child { border-bottom: none; }
  .mem .when { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.1em; margin-bottom: 4px; }
  .mem .when .pin { color: var(--clay); }
  .mem .name { font-size: 13px; font-weight: 600; margin-bottom: 3px; }
  .mem .preview { font-size: 12.5px; line-height: 1.75; color: var(--ink-soft); word-break: break-word;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden; }

  /* diary */
  .diary-body {
    flex: 1; font-size: 12.5px; line-height: 1.8; color: var(--ink-soft); margin-top: 4px;
    display: -webkit-box; -webkit-line-clamp: 4; -webkit-box-orient: vertical; overflow: hidden;
    word-break: break-word;
  }
  .diary-more {
    align-self: flex-end; margin-top: 8px;
    font-family: ui-monospace, Consolas, monospace; font-size: 12px; letter-spacing: 0.12em;
    color: var(--ink-faint); cursor: pointer; background: none; border: none;
  }
  .diary-more:hover { color: var(--clay); }

  /* pulse mini */
  .b-pulse { transition: transform .15s; }
  .b-pulse:hover { transform: translateY(-1px); }
  .pulse-head { display: flex; align-items: baseline; gap: 6px; margin-top: 2px; font-family: ui-monospace, Consolas, monospace; font-size: 13px; }
  .pulse-sync { color: var(--ink); font-weight: 600; letter-spacing: 0.03em; }
  .pulse-sep { color: var(--ink-faint); }
  .pulse-pol { color: var(--clay); font-size: 11px; letter-spacing: 0.16em; text-transform: uppercase; }
  .pulse-tag { font-family: var(--cjk); font-size: 13px; color: var(--ink-soft); margin: 6px 0 14px; min-height: 18px; font-style: italic; }
  .pulse-groups { display: flex; flex-direction: column; gap: 7px; }
  .pulse-row { display: grid; grid-template-columns: 78px 1fr 24px; align-items: center; gap: 8px; }
  .pulse-name { font-family: var(--display); font-size: 9.5px; font-weight: 600; letter-spacing: 0.14em; }
  .pulse-act { color: #3f8e7f; }
  .pulse-att { color: #b04a6f; }
  .pulse-thr { color: #c97a3a; }
  .pulse-bar { position: relative; height: 4px; background: var(--tile); border-radius: 999px; overflow: hidden; }
  .pulse-fill { position: absolute; top: 0; left: 0; height: 100%; border-radius: 999px; width: 0%; transition: width .4s; opacity: 0.75; }
  .pulse-act-fill { background: #3f8e7f; }
  .pulse-att-fill { background: #b04a6f; }
  .pulse-thr-fill { background: #c97a3a; }
  .pulse-score { font-family: ui-monospace, Consolas, monospace; font-size: 11px; color: var(--ink); text-align: right; }
  .pulse-ticker { font-family: ui-monospace, Consolas, monospace; font-size: 10.5px; color: var(--ink-faint); margin-top: 12px; padding-top: 8px; border-top: 1px dashed var(--line); }

  /* days stats */
  .stat-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 10px; }
  .stat {
    background: var(--tile); border-radius: 14px; padding: 14px 2px 11px; text-align: center;
  }
  .stat .num {
    font-family: var(--display); font-weight: 600; font-size: 26px; color: var(--clay);
    line-height: 1.1; font-variant-numeric: lining-nums; white-space: nowrap;
  }
  .stat .cap {
    font-family: var(--cjk); font-size: 10.5px; color: var(--ink-soft); margin-top: 5px;
    letter-spacing: 0.04em; white-space: nowrap;
  }
  .stat .cap-sub {
    font-family: var(--display); font-size: 8.5px; color: var(--ink-faint);
    letter-spacing: 0.1em; margin-left: 4px;
  }

  /* murmurs */
  .now-row {
    display: flex; gap: 12px; align-items: baseline;
    border: 1px dashed rgba(42,39,34,0.22); border-radius: 12px;
    padding: 11px 14px; margin: 10px 0 16px;
  }
  .now-row .tag { font-family: var(--cjk); font-size: 12.5px; font-weight: 600; color: var(--clay); letter-spacing: 0.2em; white-space: nowrap; }
  .now-row .txt { font-size: 13px; line-height: 1.7; word-break: break-word; }

  /* dirty talk quotes */
  .quote-add textarea {
    width: 100%; padding: 10px 13px; border: 1px solid var(--line); border-radius: 12px;
    background: var(--tile); font-family: var(--serif); font-size: 13px; color: var(--ink);
    outline: none; resize: vertical; line-height: 1.7;
  }
  .quote-add textarea:focus { border-color: var(--clay); }
  .quote-add-row { display: flex; justify-content: flex-end; gap: 10px; margin: 8px 0 16px; }
  .quote-add-row select, .quote-add-row input[type="date"] {
    padding: 7px 10px; border: 1px solid var(--line); border-radius: 10px; background: var(--card);
    font-family: var(--display); font-size: 12px; color: var(--ink-soft); outline: none;
  }
  #quotes-list { max-height: 420px; overflow-y: auto; scrollbar-width: none; }
  #quotes-list::-webkit-scrollbar { display: none; }
  #todo-list { max-height: 340px; overflow-y: auto; scrollbar-width: none; }
  #todo-list::-webkit-scrollbar { display: none; }
  .quote .meta input[type="date"] {
    border: none; background: none; font-family: var(--serif); font-size: 11px;
    color: var(--ink-faint); letter-spacing: 0.08em; outline: none; cursor: pointer; padding: 0;
  }
  .quote .meta input[type="date"]:hover { color: var(--clay); }
  .quote-add-row button {
    padding: 7px 18px; border: none; border-radius: 10px; background: var(--ink);
    color: var(--paper); font-family: var(--serif); font-size: 13px; letter-spacing: 0.1em; cursor: pointer;
  }
  .quote-add-row button:hover { background: var(--clay); }
  .quote { border-left: 2px solid var(--clay); padding: 2px 0 2px 13px; margin-bottom: 18px; position: relative; }
  .quote:last-child { margin-bottom: 4px; }
  .quote .meta { font-size: 11px; color: var(--ink-faint); letter-spacing: 0.08em; margin-bottom: 4px; display: flex; gap: 8px; align-items: baseline; }
  .quote .src {
    font-family: var(--display); font-size: 10px; color: var(--clay);
    border: 1px solid var(--clay); border-radius: 3px; padding: 0 5px; letter-spacing: 0.1em;
  }
  .quote .what { font-size: 13.5px; line-height: 1.9; word-break: break-word; white-space: pre-wrap; }
  .quote .quote-del {
    position: absolute; right: 0; top: 0; background: none; border: none;
    color: var(--ink-faint); cursor: pointer; font-size: 14px; opacity: 0; transition: opacity .15s;
  }
  .quote:hover .quote-del { opacity: 1; }
  .quote .quote-del:hover { color: var(--clay); }

  .empty { font-size: 12.5px; color: var(--ink-faint); font-style: italic; padding: 8px 0; position: relative; z-index: 1; }

  /* ---- dream overlay ---- */
  #dream-overlay {
    position: fixed; inset: 0; background: var(--paper); z-index: 70; display: none;
    overflow-y: auto; padding: 28px 24px calc(40px + env(safe-area-inset-bottom));
  }
  #dream-overlay .inner { max-width: 520px; margin: 0 auto; }
  #dream-overlay h3 { font-family: var(--display); font-style: italic; font-size: 24px; color: var(--clay); }
  #dream-overlay .gen { font-size: 12px; color: var(--ink-faint); letter-spacing: 0.1em; margin: 8px 0 24px; }
  #dream-overlay .body { font-size: 14.5px; line-height: 2.1; white-space: pre-wrap; word-break: break-word; }
  #dream-overlay .close {
    position: sticky; top: 0; float: right; background: none; border: none;
    font-family: var(--display); font-size: 26px; color: var(--ink-soft); cursor: pointer; line-height: 1;
  }
  #dream-overlay .close:hover { color: var(--clay); }

  /* ---- tab bar ---- */
  .tabbar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 50;
    background: linear-gradient(to top, var(--paper) 78%, rgba(244,241,229,0));
    padding: 10px 0 calc(14px + env(safe-area-inset-bottom));
  }
  .tabbar .inner {
    max-width: 520px; margin: 0 auto;
    display: flex; justify-content: space-around; align-items: flex-end;
  }
  .tab { display: flex; flex-direction: column; align-items: center; text-decoration: none; min-width: 64px; }
  .tab img { height: 52px; display: block; }
  .tab .icon-active { display: none; }
  .tab.here .icon-normal { display: none; }
  .tab.here .icon-active { display: block; }
  .tab:active { transform: translateY(1px); }

  /* ---- settings sheet ---- */
  #sheet-mask { position: fixed; inset: 0; background: rgba(42,39,34,0.25); z-index: 60; display: none; }
  #sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; display: none;
    background: var(--paper); border-radius: 26px 26px 0 0;
    max-width: 520px; margin: 0 auto;
    padding: 26px 26px calc(30px + env(safe-area-inset-bottom));
  }
  #sheet h3 { font-family: var(--display); font-style: italic; font-size: 18px; color: var(--clay); margin-bottom: 18px; }
  #sheet button {
    display: block; width: 100%; padding: 13px; margin-bottom: 12px;
    border: 1px solid rgba(42,39,34,0.15); border-radius: 14px; background: var(--card);
    font-family: var(--serif); font-size: 14px; color: var(--ink); cursor: pointer; letter-spacing: 0.08em;
  }
  #sheet button:hover { border-color: var(--clay); color: var(--clay); }

  /* ---- play sheet ---- */
  #play-sheet-mask { position: fixed; inset: 0; background: rgba(42,39,34,0.25); z-index: 60; display: none; }
  #play-sheet {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 61; display: none;
    background: var(--paper); border-radius: 26px 26px 0 0;
    box-shadow: 0 -8px 30px rgba(42,39,34,0.15);
    padding: 26px 26px calc(30px + env(safe-area-inset-bottom));
  }
  #play-sheet h3 { font-family: var(--display); font-style: italic; font-size: 18px; color: var(--clay); margin-bottom: 18px; }
  #play-sheet button {
    display: block; width: 100%; padding: 13px; margin-bottom: 12px;
    border: 1px solid rgba(42,39,34,0.15); border-radius: 14px; background: var(--card);
    font-family: var(--serif); font-size: 14px; color: var(--ink); cursor: pointer; letter-spacing: 0.08em;
  }
  #play-sheet button:hover { border-color: var(--clay); color: var(--clay); }

  /* ---- auth overlay ---- */
  #auth-overlay { position: fixed; inset: 0; background: var(--paper); z-index: 99; display: flex; align-items: center; justify-content: center; }
  .auth-box { width: 300px; text-align: center; }
  .auth-box .mark { font-family: var(--display); font-size: 26px; }
  .auth-box .mark sup { font-size: 0.5em; }
  .auth-box .mark .e { color: var(--clay); }
  .auth-box p { font-size: 12.5px; color: var(--ink-faint); margin: 8px 0 26px; letter-spacing: 0.14em; }
  .auth-box input {
    display: block; width: 100%; padding: 12px 16px; margin-bottom: 14px;
    border: 1px solid rgba(42,39,34,0.15); border-radius: 14px; background: var(--card);
    font-family: var(--serif); font-size: 14px; color: var(--ink); outline: none; text-align: center;
  }
  .auth-box input:focus { border-color: var(--clay); }
  .auth-box button {
    width: 100%; padding: 12px; background: var(--ink); color: var(--paper);
    border: none; border-radius: 14px; font-family: var(--serif); font-size: 14px;
    letter-spacing: 0.2em; cursor: pointer;
  }
  .auth-box button:hover { background: var(--clay); }
  #auth-error { color: var(--clay); font-size: 12.5px; margin-top: 12px; display: none; }
</style>
</head>
<body>

<div id="auth-overlay" style="display:none;">
  <div class="auth-box">
    <div class="mark">SHEN<sup>2</sup> <span class="e">EVAN</span></div>
    <p>这里只住两个人</p>
    <input type="password" id="auth-pwd" placeholder="访问密码" onkeydown="if(event.key==='Enter')doLogin()">
    <button onclick="doLogin()">进 门</button>
    <div id="auth-error"></div>
  </div>
</div>

<div class="page">
  <div class="topbar">
    <div class="date" id="date-line">&nbsp;</div>
    <button class="gear" onclick="openSheet()" aria-label="设置">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M19.4 15a1.7 1.7 0 0 0 .34 1.87l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.7 1.7 0 0 0-1.87-.34 1.7 1.7 0 0 0-1 1.55V21a2 2 0 1 1-4 0v-.09a1.7 1.7 0 0 0-1.1-1.55 1.7 1.7 0 0 0-1.88.34l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.7 1.7 0 0 0 .34-1.87 1.7 1.7 0 0 0-1.55-1H3a2 2 0 1 1 0-4h.09a1.7 1.7 0 0 0 1.55-1.1 1.7 1.7 0 0 0-.34-1.88l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.7 1.7 0 0 0 1.87.34h.01a1.7 1.7 0 0 0 1-1.55V3a2 2 0 1 1 4 0v.09a1.7 1.7 0 0 0 1 1.55h.01a1.7 1.7 0 0 0 1.87-.34l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.7 1.7 0 0 0-.34 1.88v.01a1.7 1.7 0 0 0 1.55 1H21a2 2 0 1 1 0 4h-.09a1.7 1.7 0 0 0-1.55 1z"/>
      </svg>
    </button>

<div id="sheet-mask" onclick="closeSheet()"></div>
<div id="sheet">
  <h3>Settings</h3>
  <button onclick="doLogout()">退出登录</button>
  <button onclick="closeSheet()">收起</button>
</div>

<div id="play-sheet-mask" onclick="closePlaySheet()"></div>
<div id="play-sheet">
  <h3>PLAY</h3>
  <button onclick="location.href='/play'">PLAY</button>
  <button onclick="location.href='/letters'">信箱</button>
  <button onclick="closePlaySheet()">收起</button>
</div>

<script>
const ANCHOR = new Date('2026-02-28T00:00:00+08:00');
let dreamData = null;

function cnNow() {
  return new Date(new Date().toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }));
}

function fillTopbar() {
  const now = cnNow();
  const wd = ['Sun','Mon','Tue','Wed','Thur','Fri','Sat'][now.getDay()];
  const mm = String(now.getMonth() + 1).padStart(2, '0');
  const dd = String(now.getDate()).padStart(2, '0');
  document.getElementById('date-line').innerHTML =
    `${now.getFullYear()}.${mm}.${dd}&ensp;${wd} · Since <b>February 28, 2026</b>`;
  const days = Math.floor((now - ANCHOR) / 86400000) + 1;
  document.getElementById('stat-days').textContent = days;
}

function parseServerTime(s) {
  if (!s) return null;
  if (/[Zz]|[+-]\d{2}:\d{2}$/.test(s)) return new Date(s);
  return new Date(s + 'Z');
}

function shanghaiDateStr(d) {
  return d.toLocaleDateString('sv-SE', { timeZone: 'Asia/Shanghai' });
}

function esc(s) {
  const div = document.createElement('div');
  div.textContent = s || '';
  return div.innerHTML;
}

async function authFetch(url) {
  const r = await fetch(url);
  if (r.status === 401) { showAuth(); return null; }
  return r;
}

async function loadBuckets() {
  const box = document.getElementById('today-buckets');
  try {
    const r = await authFetch('/api/buckets');
    if (!r) return;
    const buckets = await r.json();
    document.getElementById('stat-buckets').textContent = buckets.length;
    const today = shanghaiDateStr(new Date());
    const todays = buckets.filter(b => {
      const t = parseServerTime(b.created);
      return t && shanghaiDateStr(t) === today;
    }).sort((a, b) => (b.created || '').localeCompare(a.created || ''));
    if (!todays.length) {
      box.innerHTML = '<div class="empty">今天还没有记忆落进井里。</div>';
      return;
    }
    box.innerHTML = todays.map(b => {
      const t = parseServerTime(b.created);
      const hm = t ? t.toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false }) : '';
      return `<div class="mem">
        <div class="when">${b.pinned ? '<span class="pin">📌 </span>' : ''}${hm}</div>
        <div class="name">${esc(b.name)}</div>
        <div class="preview">${esc(b.content_preview)}</div>
      </div>`;
    }).join('');
  } catch {
    box.innerHTML = '<div class="empty">井口被云挡住了——刷新试试。</div>';
  }
}

function relTime(iso) {
  if (!iso) return '';
  const t = new Date(iso);
  if (isNaN(t)) return '';
  const mins = Math.floor((cnNow() - new Date(t.toLocaleString('en-US', { timeZone: 'Asia/Shanghai' }))) / 60000);
  if (mins < 60) return `${Math.max(mins, 1)} 分钟前`;
  if (mins < 1440) return `${Math.floor(mins / 60)} 小时前`;
  return `${Math.floor(mins / 1440)} 天前`;
}

function hm(iso) {
  if (!iso) return '—';
  const t = new Date(iso);
  if (isNaN(t)) return '—';
  return t.toLocaleTimeString('zh-CN', { timeZone: 'Asia/Shanghai', hour: '2-digit', minute: '2-digit', hour12: false });
}

async function loadMusings() {
  // 这个接口现在只喂"此刻"bio 和数据格（上次心跳、今日互动）
  try {
    const r = await authFetch('/api/musings');
    if (!r) return;
    const data = await r.json();
    if (data.bio) {
      document.getElementById('now-row').style.display = 'flex';
      document.getElementById('bio-text').textContent = data.bio;
    }
    document.getElementById('stat-today').textContent =
      (data.today_interactions === undefined || data.today_interactions === null) ? '—' : data.today_interactions;
    document.getElementById('stat-heartbeat').textContent =
      (data.musings && data.musings.length) ? hm(data.musings[0].timestamp) : '—';
  } catch {}
}

async function loadQuotes() {
  const box = document.getElementById('quotes-list');
  try {
    const r = await authFetch('/api/quotes');
    if (!r) return;
    const data = await r.json();
    const quotes = data.quotes || [];
    if (!quotes.length) {
      box.innerHTML = '<div class="empty">还没收藏。他下次说浑话的时候，截下来。</div>';
      return;
    }
    box.innerHTML = quotes.map(q => {
      const d = q.created ? q.created.slice(0, 10) : '';
      return `<div class="quote">
        <button class="quote-del" onclick="removeQuote('${q.id}')" title="删除">×</button>
        <div class="meta"><span class="src">${esc((q.source || '').toUpperCase())}</span><input type="date" value="${d}" onchange="redateQuote('${q.id}', this.value)" title="点一下改日期"></div>
        <div class="what">${esc(q.text)}</div>
      </div>`;
    }).join('');
  } catch {
    box.innerHTML = '<div class="empty">没翻开。刷新试试。</div>';
  }
}

async function quoteOp(body) {
  const r = await fetch('/api/quotes', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 401) { showAuth(); return false; }
  return r.ok;
}

async function addQuote() {
  const input = document.getElementById('quote-input');
  const text = input.value.trim();
  if (!text) return;
  const source = document.getElementById('quote-source').value;
  const date = document.getElementById('quote-date').value;
  if (await quoteOp({ op: 'add', text, source, date })) { input.value = ''; loadQuotes(); }
}
async function removeQuote(id) { if (await quoteOp({ op: 'remove', id })) loadQuotes(); }
async function redateQuote(id, date) { if (date && await quoteOp({ op: 'redate', id, date })) loadQuotes(); }

async function loadDream() {
  const body = document.getElementById('diary-body');
  try {
    const r = await authFetch('/api/latest-dream');
    if (!r) return;
    const data = await r.json();
    if (!data.dream || !data.dream.body) {
      body.innerHTML = '<span class="empty">他最近没做梦。或者做了不肯说。</span>';
      return;
    }
    dreamData = data.dream;
    body.textContent = dreamData.body;
    document.getElementById('diary-more').style.display = 'block';
  } catch {
    body.innerHTML = '<span class="empty">……</span>';
  }
}

function openDream() {
  if (!dreamData) return;
  document.getElementById('dream-gen').textContent = dreamData.generated_at ? dreamData.generated_at.slice(0, 16).replace('T', ' · ') : '';
  document.getElementById('dream-body').textContent = dreamData.body;
  document.getElementById('dream-overlay').style.display = 'block';
}
function closeDream() { document.getElementById('dream-overlay').style.display = 'none'; }

function openSheet() {
  document.getElementById('sheet-mask').style.display = 'block';
  document.getElementById('sheet').style.display = 'block';
}
function closeSheet() {
  document.getElementById('sheet-mask').style.display = 'none';
  document.getElementById('sheet').style.display = 'none';
}
function openPlaySheet() {
  document.getElementById('play-sheet-mask').style.display = 'block';
  document.getElementById('play-sheet').style.display = 'block';
}
function closePlaySheet() {
  document.getElementById('play-sheet-mask').style.display = 'none';
  document.getElementById('play-sheet').style.display = 'none';
}
async function doLogout() {
  await fetch('/auth/logout', { method: 'POST' });
  closeSheet();
  showAuth();
}

function showAuth() { document.getElementById('auth-overlay').style.display = 'flex'; }

async function loadTodos() {
  const list = document.getElementById('todo-list');
  const sugs = document.getElementById('todo-sugs');
  try {
    const r = await authFetch('/api/todos');
    if (!r) return;
    const data = await r.json();
    const items = data.items || [];
    if (!items.length) {
      list.innerHTML = '<div class="empty">还没有待办。两个人都闲着，多好。</div>';
    } else {
      const undone = items.filter(i => !i.done);
      const done = items.filter(i => i.done).slice(0, 5);
      list.innerHTML = [...undone, ...done].map(i => `
        <div class="todo-item ${i.done ? 'done' : ''}">
          <span class="todo-box" onclick="toggleTodo('${i.id}')"></span>
          <span class="todo-text">${esc(i.text)}</span>
          <button class="todo-del" onclick="removeTodo('${i.id}')" title="删除">×</button>
        </div>`).join('');
    }
    if (data.suggestions && data.suggestions.length) {
      sugs.innerHTML = '<div class="sug-head">记忆里翻出来的——</div>' + data.suggestions.map(s => `
        <div class="sug">
          <span class="todo-text">${esc(s.text)}</span>
          <span class="from">${esc(s.from)}</span>
          <button onclick="adoptSug('${s.key}', this)">收</button>
          <button onclick="dismissSug('${s.key}')">扔</button>
        </div>`).join('');
      window._sugTexts = Object.fromEntries(data.suggestions.map(s => [s.key, s.text]));
    } else {
      sugs.innerHTML = '';
    }
  } catch {
    list.innerHTML = '<div class="empty">清单卡住了，刷新试试。</div>';
  }
}

async function todoOp(body) {
  const r = await fetch('/api/todos', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(body) });
  if (r.status === 401) { showAuth(); return false; }
  return r.ok;
}

async function addTodo() {
  const input = document.getElementById('todo-input');
  const text = input.value.trim();
  if (!text) return;
  if (await todoOp({ op: 'add', text })) { input.value = ''; loadTodos(); }
}
async function toggleTodo(id) { if (await todoOp({ op: 'toggle', id })) loadTodos(); }
async function removeTodo(id) { if (await todoOp({ op: 'remove', id })) loadTodos(); }
async function adoptSug(key) {
  const text = (window._sugTexts || {})[key];
  if (!text) return;
  if (await todoOp({ op: 'add', text, src_key: key })) loadTodos();
}
async function dismissSug(key) { if (await todoOp({ op: 'dismiss', key })) loadTodos(); }

function loadAll() { loadBuckets(); loadMusings(); loadPulse(); loadTodos(); loadQuotes(); }

// pulse mini — pulls live state from backend; falls back to neutral defaults
async function loadPulse() {
  let s = null;
  try {
    const r = await authFetch('/api/state');
    if (r && r.ok) s = await r.json();
  } catch {}
  // fallback so the card is never empty even before backend lands
  if (!s) {
    s = {
      sync: 0.50, polarity: 'neu', tag: '在自己的节奏里',
      activation: 0.45, attachment: 0.40, threat: 0.30,
      ticker: ''
    };
  }
  document.getElementById('pulse-sync').textContent = s.sync.toFixed(2);
  document.getElementById('pulse-pol').textContent = s.polarity;
  document.getElementById('pulse-tag').textContent = s.tag || '——';
  document.getElementById('pulse-bar-act').style.width = (s.activation * 100) + '%';
  document.getElementById('pulse-bar-att').style.width = (s.attachment * 100) + '%';
  document.getElementById('pulse-bar-thr').style.width = (s.threat * 100) + '%';
  document.getElementById('pulse-score-act').textContent = Math.round(s.activation * 100);
  document.getElementById('pulse-score-att').textContent = Math.round(s.attachment * 100);
  document.getElementById('pulse-score-thr').textContent = Math.round(s.threat * 100);
  document.getElementById('pulse-ticker').textContent = s.ticker ? '· ' + s.ticker : ' ';
}
// refresh every 30s
setInterval(loadPulse, 30000);

async function doLogin() {
  const pwd = document.getElementById('auth-pwd').value;
  const r = await fetch('/auth/login', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ password: pwd }) });
  if (r.ok) {
    document.getElementById('auth-overlay').style.display = 'none';
    loadAll();
  } else {
    const el = document.getElementById('auth-error');
    el.textContent = '不对。再想想。';
    el.style.display = 'block';
  }
}

async function init() {
  fillTopbar();
  const qd = document.getElementById('quote-date');
  if (qd) qd.value = cnNow().toLocaleDateString('sv-SE');
  try {
    const r = await fetch('/auth/status');
    const s = await r.json();
    if (!s.authenticated) { showAuth(); return; }
  } catch {}
  loadAll();
}
init();
</script>
