<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#faf9f5" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#1c1b18" media="(prefers-color-scheme: dark)">
  <title>Tag Dice — 100 days</title>
  <link rel="stylesheet" href="/play/style.css">
</head>
<body>
  <main>
    <header>
      <h1>
        <svg class="title-dice" viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3.5"/>
          <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
        <span>Tag Dice</span>
      </h1>
      <p class="sub"><a href="/" style="color:inherit;">← 回首页</a> · 改 <code>tags.js</code> 扩展。红线在每个库的 <code>blocklist</code>。</p>
    </header>

    <section class="row-label">风格</section>
    <section class="style-switch" id="styleSwitch" aria-label="Style"></section>

    <section class="row-label">Preset</section>
    <section class="presets" id="presets" aria-label="Preset"></section>

    <section class="card" id="card" hidden>
      <ul id="result"></ul>
      <div class="chips" id="chips" aria-label="Tags"></div>
    </section>

    <section class="controls">
      <button id="roll" class="primary" type="button">
        <svg class="dice-icon" viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <rect x="3" y="3" width="18" height="18" rx="3.5"/>
          <circle cx="8.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="15.5" r="1.3" fill="currentColor" stroke="none"/>
          <circle cx="15.5" cy="8.5" r="1.3" fill="currentColor" stroke="none"/>
        </svg>
        <span>Roll</span>
      </button>
      <button id="copy" type="button">复制全部</button>
    </section>

    <p class="hint">右侧 ↻ 单独重抽 · 空格全部重抽 · 点 tag 标签复制单条</p>

    <section class="generate-row">
      <button id="generateBtn" type="button" class="generate-btn">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
          <path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/>
          <path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/>
        </svg>
        <span>生成文字板</span>
      </button>
      <span class="generate-hint">让 AI 按上面 7 个 tag 写一段</span>
    </section>

    <section class="story" id="story" hidden>
      <div class="story-head">
        <span class="row-label inline">生成的描写</span>
        <div class="story-actions">
          <button id="storyRegen" type="button" class="ghost-btn" title="重新生成">↻ 重写</button>
          <button id="storyCopy" type="button" class="ghost-btn">复制</button>
          <button id="storyClose" type="button" class="ghost-btn" title="关闭">×</button>
        </div>
      </div>
      <div class="story-body" id="storyBody"></div>
      <p class="story-meta" id="storyMeta"></p>
    </section>

    <section class="history" id="historySection" hidden>
      <div class="history-head">
        <span class="row-label inline">最近抽到</span>
        <button id="clearHistory" class="ghost-btn" type="button">清空</button>
      </div>
      <ul id="historyList"></ul>
    </section>
  </main>

  <script src="/play/tags.js"></script>
  <script src="/play/app.js"></script>
</body>
</html>
