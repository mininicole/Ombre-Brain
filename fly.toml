# Ombre Brain on Fly.io
# 单一记忆源，给 Claude Desktop / Evan / Kelivo 等所有客户端用

app = 'ombre-brain'
primary_region = 'nrt'

[build]

[env]
  OMBRE_TRANSPORT = 'streamable-http'
  OMBRE_BUCKETS_DIR = '/app/buckets'

[http_service]
  internal_port = 8000
  force_https = true
  # 不挂起：Evan 主动查询时需要立刻响应，wake-up 延迟会让对话变卡
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  [[http_service.checks]]
    interval = '60s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[mounts]
  source = 'ombre_data'
  destination = '/app/buckets'
