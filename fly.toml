# Ombre Brain on Fly.io
# 单一记忆源，给 Claude Desktop / Evan / Kelivo 等所有客户端用

app = 'ombre-brain'
primary_region = 'nrt'

[build]

[env]
  OMBRE_TRANSPORT = 'streamable-http'
  OMBRE_BUCKETS_DIR = '/app/buckets'
  # /chat 的摘要小工（思考摘要/工具标题）每个都是独立 claude CLI，
  # 512MB 机器养不起三个引擎——关掉，只留主对话（2026-07-02）
  CHAT_DISABLE_SUMMARIES = '0'
  # Night-Fall 浮现调参：默认 0.62 太严，开窗几乎只走 affect 单通道，
  # 把门槛降到 0.50（affect 单轴偏差容忍从 ±0.27 放宽到 ±0.35），
  # 自发概率 0.02 → 0.06，attempt 跟着降以保持"低信号不消耗机会"语义。
  NIGHT_FALL_SURFACE_THRESHOLD = '0.50'
  NIGHT_FALL_ATTEMPT_THRESHOLD = '0.35'
  NIGHT_FALL_SPONTANEOUS_SURFACE_PROB = '0.06'
  # Dream generation is externally woken every day, but the persistent guard
  # permits at most one successful generation per 72 hours.
  NIGHT_FALL_GENERATION_COOLDOWN_HOURS = '72'
  NIGHT_FALL_SOURCE_COOLDOWN_GENERATIONS = '2'
  NIGHT_FALL_DUPLICATE_SIMHASH_DISTANCE = '4'

[http_service]
  internal_port = 8000
  force_https = true
  # 挂起模式（2026-07-03 起）：闲时 suspend 省钱（1GB 常驻会顶破 Fly
  # $5 免费额度线）。suspend 状态下内部循环停摆——
  #   · 夜间做梦：靠外部 GitHub Actions 每天 19 UTC POST /api/night_fall/generate
  #     唤醒机器 + 直接触发做梦（见 mininicole/evan-bot 的 nightfall-wake.yml）
  #   · 一次性 schedule_message：落在挂起时段的可能漏发，暂无补偿
  # suspend 保留内存态，唤醒约 1~2s，比 stop 冷启动快得多
  auto_stop_machines = 'suspend'
  auto_start_machines = true
  min_machines_running = 0

  # ⚠️ 这个 health check 必须保留。它有两个作用：
  # 1. fly proxy 的 readiness probe — 看到 /health 200 才把外部流量转给 machine
  # 2. 检测 ombre 进程是否健康
  # 删掉它会导致 wake 后 fly proxy 在 ASGI lifespan 没跑完时就转发请求 → 404
  # health check 流量是 fly 内部的，不算 user inbound，不会阻止 suspend
  [[http_service.checks]]
    interval = '60s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

# 2026-07-02 加 swap：/chat 的 ChatNest + Claude Code CLI 跟 ombre 同容器，
# swap 保留作二级缓冲，但主内存 2026-07-03 升到 1GB：
# 512MB 下 /chat（主对话 + 摘要小工 + node）持续 OOM 抖动，
# "连接意外结束"反复出现。深深预批动用（真实底座约 $2.5，压 $5 线内）。
swap_size_mb = 1024

[[vm]]
  size = 'shared-cpu-1x'
  memory = '1gb'

[mounts]
  source = 'ombre_data'
  destination = '/app/buckets'
