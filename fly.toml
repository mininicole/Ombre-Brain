# Ombre Brain on Fly.io
# 单一记忆源，给 Claude Desktop / Evan / Kelivo 等所有客户端用

app = 'ombre-brain'
primary_region = 'nrt'

[build]

[env]
  OMBRE_TRANSPORT = 'streamable-http'
  OMBRE_BUCKETS_DIR = '/app/buckets'
  # Night-Fall 浮现调参：默认 0.62 太严，开窗几乎只走 affect 单通道，
  # 把门槛降到 0.50（affect 单轴偏差容忍从 ±0.27 放宽到 ±0.35），
  # 自发概率 0.02 → 0.06，attempt 跟着降以保持"低信号不消耗机会"语义。
  NIGHT_FALL_SURFACE_THRESHOLD = '0.50'
  NIGHT_FALL_ATTEMPT_THRESHOLD = '0.35'
  NIGHT_FALL_SPONTANEOUS_SURFACE_PROB = '0.06'

[http_service]
  internal_port = 8000
  force_https = true
  # 常驻模式（2026-06-12 起）：夜间自动做梦（19 UTC）和定时消息派发
  # 都依赖进程活着——suspend 状态下两者都不会发生，所以不再闲时挂起
  auto_stop_machines = 'off'
  auto_start_machines = true
  min_machines_running = 1

  # ⚠️ 这个 health check 必须保留。它有两个作用：
  # 1. fly proxy 的 readiness probe — 看到 /health 200 才把外部流量转给 machine
  # 2. 检测 ombre 进程是否健康
  # 删掉它会导致 wake 后 fly proxy 在 ASGI lifespan 没跑完时就转发请求 → 404
  # health check 流量是 fly 内部的，不算 user inbound，不会阻止 suspend
  [[http_service.checks]]
    interval = '60s'
    timeout = '5s'
    grace_period = '15s'
    method = 'GET'
    path = '/health'

# 2026-07-02 加 swap：/chat 的 ChatNest + Claude Code CLI 跟 ombre 同容器，
# 512MB 物理内存不够峰值用，但预算上限 $5/月不能升配——
# 用免费 swap 兜住峰值（CLI 大部分时间在等模型响应，换出去无感）
swap_size_mb = 1024

[[vm]]
  size = 'shared-cpu-1x'
  memory = '512mb'

[mounts]
  source = 'ombre_data'
  destination = '/app/buckets'
